[workspace]
resolver = "2"
members = ["luma", "luma-desktop"]

[workspace.package]
version = "7.2.1"
description = "Luma Windows screensaver, based on Flux"
edition = "2021"
license = "MIT"
license-file = "LICENSE"
homepage = "https://luma.ksmvc.ch"
repository = "https://github.com/Ken5998/luma"
authors = ["Kenan Kasumović", "Sander Melnikov <hey@sandydoo.me>"]

[workspace.dependencies.wgpu]
version = "30.0"

[workspace.dependencies.image]
features = ["jpeg", "png"]
version = "0.25"

[workspace.dependencies]
approx = "0.5.1"
env_logger = "0.11"
bytemuck = { version = "1.4", features = ["derive"] }
luma = { path = "./luma" }
futures = "0.3"
getrandom = "0.4"
glam = "0.32"
half = { version = "2", features = ["bytemuck"] }
log = "0.4"
pollster = "0.4"
rand = { version = "0.10", features = ["thread_rng"] }
rand_pcg = "0.10"
rand_seeder = "0.5"
raw-window-handle = "0.6"
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.36.0", features = ["full"] }
winit = "0.30"

# The unoptimized build is too slow
[profile.dev.package.image]
opt-level = 3

[profile.release]
codegen-units = 1 # Allow further optimisations by disabling parallel compilation
lto = true        # Enable link-time optimisations
opt-level = "s"   # Optimise for size
panic = "abort"   # Strip expensive panic unwinding code
