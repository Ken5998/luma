name: Build Windows package and deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test VirusTotal release scripts
        shell: pwsh
        run: ./scripts/test-virustotal.ps1
      - name: Set up Rust
        run: rustup default stable
      - name: Test desktop and renderer
        run: cargo test --locked --release -p luma -p luma-desktop
      - name: Build install package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: |
            target/distribution/Luma-windows-x64.zip
            target/distribution/Luma-windows-x64.zip.sha256
  pages:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: site/downloads
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
