name: Scan release with VirusTotal
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (installer, ZIP and SHA256SUMS.txt must be uploaded)
        required: true
        default: v0.1.0
      report_only:
        description: Refresh recorded analyses without uploading the files again
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: virustotal-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write # Read draft assets and update notes; never publish or replace assets.
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test VirusTotal integration without network access
        run: ./scripts/test-virustotal.ps1
      - name: Scan final release assets and update reports
        env:
          GH_TOKEN: ${{ github.token }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          REPORT_ONLY: ${{ inputs.report_only }}
        run: ./scripts/scan-release.ps1 -Tag $env:RELEASE_TAG -Repository $env:RELEASE_REPOSITORY -ReportOnly:($env:REPORT_ONLY -eq 'true')
      - name: Save scan diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: virustotal-reports
          path: |
            target/virustotal/**/virustotal.md
            target/virustotal/**/virustotal-results.json
          if-no-files-found: ignore
