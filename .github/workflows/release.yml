name: Build draft MSI release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup default stable
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Validate tag and test
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $version = ($metadata.packages | Where-Object name -eq 'luma-desktop').version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match the Cargo workspace version.' }
          "LUMA_VERSION=$version" | Add-Content $env:GITHUB_ENV
          cargo test --locked --release -p luma -p luma-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Application tests failed.' }
          cargo test --locked --manifest-path packaging/windows/msi/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Native installer tests failed.' }
          ./scripts/test-deployment.ps1
          ./scripts/test-uninstall-handoff.ps1
          ./scripts/test-virustotal.ps1
      - name: Build and verify MSI and ZIP
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            target/releases/${{ env.LUMA_VERSION }}/Luma-${{ env.LUMA_VERSION }}-Setup-x64.msi
            target/releases/${{ env.LUMA_VERSION }}/Luma-${{ env.LUMA_VERSION }}-windows-x64.zip
            target/releases/${{ env.LUMA_VERSION }}/SHA256SUMS.txt
          if-no-files-found: error
  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: release-packages
      - name: Create draft only; never replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if echo "$existing" | grep -Fxq "$GITHUB_REF_NAME"; then
            echo 'Release already exists; refusing to replace assets.' >&2
            exit 1
          fi
          cd release-packages
          sha256sum --strict --check SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Luma v$version — MSI installer" --notes-file "docs/RELEASE-v$version.md" "release-packages/Luma-$version-Setup-x64.msi" "release-packages/Luma-$version-windows-x64.zip" release-packages/SHA256SUMS.txt
