name: Build Windows release
# A version bump merged into main publishes that version automatically:
# tests, MSI/ZIP build, release with the new tag, then the VirusTotal scan.
# Pushing a v* tag by hand still builds a draft for manual review.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Decide whether this commit releases a new version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "luma-desktop") | .version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]] || { echo "Tag $GITHUB_REF_NAME must match the Cargo workspace version $version." >&2; exit 1; }
            mode=draft
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to release."
            mode=skip
          else
            mode=publish
          fi
          if [[ "$mode" != skip && ! -f "docs/RELEASE-$tag.md" ]]; then
            echo "docs/RELEASE-$tag.md is required for the release notes." >&2
            exit 1
          fi
          echo "Release plan: $tag ($mode)" >> "$GITHUB_STEP_SUMMARY"
          { echo "version=$version"; echo "tag=$tag"; echo "mode=$mode"; } >> "$GITHUB_OUTPUT"
  package:
    needs: prepare
    if: needs.prepare.outputs.mode != 'skip'
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup default stable
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: |
          "LUMA_VERSION=${{ needs.prepare.outputs.version }}" | Add-Content $env:GITHUB_ENV
          cargo test --locked --release -p luma -p luma-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Application tests failed.' }
          cargo test --locked --manifest-path packaging/windows/msi/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Native installer tests failed.' }
          ./scripts/test-deployment.ps1
          ./scripts/test-uninstall-handoff.ps1
          ./scripts/test-virustotal.ps1
      - name: Build and verify MSI and ZIP
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            target/releases/${{ env.LUMA_VERSION }}/Luma-${{ env.LUMA_VERSION }}-Setup-x64.msi
            target/releases/${{ env.LUMA_VERSION }}/Luma-${{ env.LUMA_VERSION }}-windows-x64.zip
            target/releases/${{ env.LUMA_VERSION }}/SHA256SUMS.txt
          if-no-files-found: error
  release:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: release-packages
      - name: Create the release; never replace an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          MODE: ${{ needs.prepare.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if echo "$existing" | grep -Fxq "$TAG"; then
            echo 'Release already exists; refusing to replace assets.' >&2
            exit 1
          fi
          cd release-packages
          sha256sum --strict --check SHA256SUMS.txt
          cd ..
          assets=("release-packages/Luma-$VERSION-Setup-x64.msi" "release-packages/Luma-$VERSION-windows-x64.zip" release-packages/SHA256SUMS.txt)
          if [[ "$MODE" == draft ]]; then
            gh release create "$TAG" --verify-tag --draft --title "Luma v$VERSION" --notes-file "docs/RELEASE-$TAG.md" "${assets[@]}"
          else
            # Creates the tag on the tested commit and publishes immediately.
            gh release create "$TAG" --target "$GITHUB_SHA" --latest --title "Luma v$VERSION" --notes-file "docs/RELEASE-$TAG.md" "${assets[@]}"
          fi
  scan:
    # Releases published with the workflow token do not trigger other workflows,
    # so the VirusTotal scan is called directly.
    needs: [prepare, release]
    if: needs.prepare.outputs.mode == 'publish'
    permissions:
      contents: write
    uses: ./.github/workflows/virustotal.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
